<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>National 5 Business Management Revision Hub</title>
  <meta name="description" content="Qualifications Scotland (SQA) National 5 Business Management Revision Hub — Lessons, YouTube Video Guides, SQA Command Word Drills (Identify, Describe, Explain), Past Papers, Case Studies & Monthly Homework." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="N5 Business" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="manifest" href="./manifest.json?v=70" />
  <link rel="icon" type="image/png" href="./n5-app-icon.png?v=70" />
  <link rel="apple-touch-icon" href="./n5-app-icon.png?v=70" />
  <link rel="stylesheet" href="./styles.css?v=70" />
</head>
<body>
  <div id="app"></div>
  <script src="./hubData.js?v=70"></script>
  <script src="./app.js?v=70"></script>
  <script>
    (function () {
      const appScript = document.querySelector('script[src*="app.js?v="]');
      const curMatch = appScript ? appScript.getAttribute("src").match(/\?v=(\d+)/) : null;
      const CURRENT_V = curMatch ? curMatch[1] : "";
      let reloading = false;
      function reloadOnce() {
        const tag = (document.activeElement && document.activeElement.tagName || "").toUpperCase();
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (!reloading) {
          reloading = true;
          window.location.reload();
        }
      }
      function checkLatestVersion() {
        if (!CURRENT_V) return;
        fetch("./index.html?t=" + Date.now(), { cache: "no-store" })
          .then(r => r.ok ? r.text() : "")
          .then(html => {
            const m = html.match(/app\.js\?v=(\d+)/);
            if (m && m[1] !== CURRENT_V) reloadOnce();
          })
          .catch(() => {});
      }
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
        navigator.serviceWorker.register("./sw.js?v=70", { updateViaCache: "none" }).then(reg => {
          reg.update();
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              reg.update();
              checkLatestVersion();
            }
          });
        }).catch(() => {});
      }
      setTimeout(checkLatestVersion, 3000);
    })();
  </script>
</body>
</html>
